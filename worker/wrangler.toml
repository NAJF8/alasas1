name = "alasas-dental-staging-worker"
main = "src/index.ts"
compatibility_date = "2026-10-21"
workers_dev = true

[vars]
FIREBASE_PROJECT_ID = "al-asas-dental-staging"
ALLOWED_ORIGINS = "https://al-asas-dental-staging.web.app,https://al-asas-dental-admin.web.app,http://localhost:5173,http://localhost:5174"
RELEASE_SHA = "85283ec"

# Add this only with `wrangler secret put FIREBASE_SERVICE_ACCOUNT_JSON`.
# Never commit the service-account JSON or a private key.

# R2 is intentionally disabled for this Staging release. The Worker keeps
# image routes fail-closed with R2_NOT_CONFIGURED until a separately approved
# storage path exists; no paid bucket is provisioned here.
