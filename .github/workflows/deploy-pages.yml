name: Deploy GitHub Pages

on:
  # Hard safety gate: automated deployment on merge is disabled to prevent accidental production overwrite of dental.alasas.tech.
  # Production rollout to GitHub Pages requires explicit manual trigger via workflow_dispatch after full sign-off.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      # Hard safety gate: change only in a separately approved rollout after
      # the backend is deployed and the limited Production canaries pass.
      VITE_REGISTRATION_BACKEND_ENABLED: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            customer-app/package-lock.json
            admin-app/package-lock.json

      - name: Install customer dependencies
        working-directory: customer-app
        run: npm ci

      - name: Build customer app
        working-directory: customer-app
        run: npm run build

      - name: Install admin dependencies
        working-directory: admin-app
        run: npm ci

      - name: Build admin app
        working-directory: admin-app
        run: npm run build

      - name: Assemble Pages artifact
        shell: bash
        run: |
          rm -rf dist-deploy
          mkdir -p dist-deploy/admin
          cp -R customer-app/dist/. dist-deploy/
          cp -R admin-app/dist/. dist-deploy/admin/
          printf 'dental.alasas.tech\n' > dist-deploy/CNAME
          touch dist-deploy/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-deploy

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
