name: CI Test Suite

on:
  pull_request:
    branches: [main]
  push:
    branches: [codex/*, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build & Verify Test Suite
    runs-on: ubuntu-latest
    env:
      # CI builds target STAGING only; apps have no built-in production fallbacks.
      VITE_FIREBASE_API_KEY: AIzaSyDO4QHtOT0HQ-t7CgbdwDfgTuYPni23Vxc
      VITE_FIREBASE_AUTH_DOMAIN: al-asas-dental-staging.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: al-asas-dental-staging
      VITE_FIREBASE_STORAGE_BUCKET: al-asas-dental-staging.firebasestorage.app
      VITE_FIREBASE_MESSAGING_SENDER_ID: '915871985225'
      VITE_FIREBASE_APP_ID: 1:915871985225:web:882308a631a4ef87df9998
      VITE_FIREBASE_BACKEND_URL: https://alasas-dental-staging-worker.coffee101.workers.dev
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            customer-app/package-lock.json
            admin-app/package-lock.json

      - name: Install Worker Dependencies
        working-directory: worker
        run: npm ci

      - name: Run Worker Unit Tests
        working-directory: worker
        run: |
          node --version
          npm test
          npm run typecheck

      - name: Setup Java (Firestore emulator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Run Firestore Security Rules Tests (emulator)
        working-directory: tools/rules-tests
        run: |
          npm ci --no-audit --no-fund
          npm test

      - name: Run Production Seed Importer Regression Tests
        run: node --test tools/migration/import-canonical-production-seed.test.mjs

      - name: Install Customer App Dependencies
        working-directory: customer-app
        run: npm ci

      - name: Run Customer App Hermetic Tests
        working-directory: customer-app
        run: |
          npm run test:registration
          npm run test:registration-flow
          npm run test:remove-complete-profile
          npm run test:theme
          npm run test:isolation
          npm run test:permissions

      - name: Lint Customer App
        working-directory: customer-app
        run: npm run lint

      - name: Build Customer App
        working-directory: customer-app
        run: npm run build

      - name: Install Admin App Dependencies
        working-directory: admin-app
        run: npm ci

      - name: Run Admin App Hermetic Tests
        working-directory: admin-app
        run: |
          npm run test:management-display
          npm run test:theme

      - name: Lint Admin App
        working-directory: admin-app
        run: npm run lint

      - name: Build Admin App
        working-directory: admin-app
        run: npm run build

      - name: Assemble Unified Distribution
        run: node tools/build-unified.mjs

      - name: Verify Build Artifacts Integrity
        run: |
          test -f dist-deploy/index.html || { echo "Missing customer index.html"; exit 1; }
          test -f dist-deploy/admin/index.html || { echo "Missing admin index.html"; exit 1; }
          echo "Build artifacts verified cleanly."
