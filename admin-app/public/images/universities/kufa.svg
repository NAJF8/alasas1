<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200">
  <defs>
    <linearGradient id="kufa-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2a4a"/>
      <stop offset="100%" stop-color="#115582"/>
    </linearGradient>
    <linearGradient id="kufa-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#12a795"/>
      <stop offset="100%" stop-color="#60e1d0"/>
    </linearGradient>
    <filter id="kufa-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="320" height="200" rx="16" fill="url(#kufa-bg)"/>
  <circle cx="280" cy="40" r="90" fill="#146d9e" opacity="0.25"/>
  <circle cx="40" cy="170" r="70" fill="#12a795" opacity="0.15"/>
  
  <!-- Architectural silhouette / Campus -->
  <g opacity="0.18" fill="#ffffff">
    <rect x="30" y="125" width="260" height="3" rx="1.5"/>
    <rect x="45" y="95" width="40" height="30" rx="2"/>
    <rect x="235" y="95" width="40" height="30" rx="2"/>
    <path d="M120 125 V85 H200 V125 Z"/>
    <path d="M160 62 C145 62 135 73 135 85 H185 C185 73 175 62 160 62 Z"/>
    <line x1="160" y1="52" x2="160" y2="62" stroke="#ffffff" stroke-width="2"/>
  </g>

  <!-- Central Crest Card -->
  <g filter="url(#kufa-shadow)">
    <rect x="115" y="38" width="90" height="90" rx="18" fill="#ffffff"/>
    <rect x="119" y="42" width="82" height="82" rx="14" fill="#f0f7fb"/>
    
    <!-- Tooth + Academic Cap Symbol -->
    <path d="M160 56 C148 56 140 64 140 76 C140 88 144 104 150 114 C152 118 156 118 158 112 C159 108 160 102 160 102 C160 102 161 108 162 112 C164 118 168 118 170 114 C176 104 180 88 180 76 C180 64 172 56 160 56 Z" fill="url(#kufa-accent)"/>
    <path d="M150 72 L160 67 L170 72 L160 77 Z" fill="#0c3158"/>
    <path d="M170 72 V80" stroke="#0c3158" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Banner -->
  <rect x="40" y="142" width="240" height="38" rx="10" fill="#ffffff" fill-opacity="0.95" filter="url(#kufa-shadow)"/>
  <text x="160" y="160" fill="#0c3158" font-family="'IBM Plex Sans Arabic', Arial, sans-serif" font-weight="700" font-size="13" text-anchor="middle">جامعة الكوفة</text>
  <text x="160" y="173" fill="#12a795" font-family="'IBM Plex Sans Arabic', Arial, sans-serif" font-weight="600" font-size="10" text-anchor="middle">كلية طب الأسنان • النجف الأشرف</text>
</svg>