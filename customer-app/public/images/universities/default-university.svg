<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200">
  <defs>
    <linearGradient id="uni-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#143b66"/>
      <stop offset="100%" stop-color="#0f5c8c"/>
    </linearGradient>
    <linearGradient id="uni-teal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#12a795"/>
      <stop offset="100%" stop-color="#38d4bf"/>
    </linearGradient>
    <filter id="uni-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="320" height="200" rx="16" fill="url(#uni-bg)"/>
  <circle cx="280" cy="40" r="90" fill="#1cb09f" opacity="0.18"/>
  <circle cx="40" cy="160" r="80" fill="#38a5e0" opacity="0.15"/>

  <!-- Pillars &amp; Campus -->
  <g opacity="0.2" fill="#ffffff">
    <rect x="30" y="125" width="260" height="3" rx="1.5"/>
    <path d="M110 70 L160 45 L210 70 Z"/>
    <rect x="118" y="70" width="10" height="55"/>
    <rect x="143" y="70" width="10" height="55"/>
    <rect x="167" y="70" width="10" height="55"/>
    <rect x="192" y="70" width="10" height="55"/>
  </g>

  <!-- Central Crest Card -->
  <g filter="url(#uni-shadow)">
    <rect x="115" y="38" width="90" height="90" rx="18" fill="#ffffff"/>
    <rect x="119" y="42" width="82" height="82" rx="14" fill="#f2f8fc"/>
    
    <!-- Tooth with academic shield -->
    <path d="M160 56 C148 56 140 64 140 76 C140 88 144 104 150 114 C152 118 156 118 158 112 C159 108 160 102 160 102 C160 102 161 108 162 112 C164 118 168 118 170 114 C176 104 180 88 180 76 C180 64 172 56 160 56 Z" fill="url(#uni-teal)"/>
    <path d="M160 68 L152 73 L160 78 L168 73 Z" fill="#0f3b64"/>
    <line x1="168" y1="73" x2="168" y2="82" stroke="#0f3b64" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Banner -->
  <rect x="40" y="142" width="240" height="38" rx="10" fill="#ffffff" fill-opacity="0.95" filter="url(#uni-shadow)"/>
  <text x="160" y="160" fill="#0f3b64" font-family="'IBM Plex Sans Arabic', Arial, sans-serif" font-weight="700" font-size="13" text-anchor="middle">جامعة معتمدة</text>
  <text x="160" y="173" fill="#12a795" font-family="'IBM Plex Sans Arabic', Arial, sans-serif" font-weight="600" font-size="10" text-anchor="middle">كلية طب الأسنان • شريك سريري</text>
</svg>